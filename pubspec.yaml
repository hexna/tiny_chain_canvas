name: skill_tree_canvas
description: A force-directed skill-tree canvas for Flutter with level-gravity columns, pan and
  zoom, node dragging and tunable physics, and zero third-party dependencies.
version: 0.2.0
homepage: https://github.com/hexna/skill_tree_canvas
repository: https://github.com/hexna/skill_tree_canvas
issue_tracker: https://github.com/hexna/skill_tree_canvas/issues
topics:
  - flutter
  - canvas
  - force-directed
  - graph
  - visualization

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
